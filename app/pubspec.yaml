name: grlab
description: Companion app for Ricoh GR cameras (pairing, photo browsing and download).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  gr_fake_camera:
    path: ../packages/gr_fake_camera
  gr_protocol:
    path: ../packages/gr_protocol
  path_provider: ^2.1.6
  universal_ble: ^3.2.0
  video_player: ^2.14.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/welcome.jpg
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
