name: grlab
description: Companion app for Ricoh GR cameras (pairing, photo browsing and download).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  gr_camera:
    path: ../packages/gr_camera
  gr_fake_camera:
    path: ../packages/gr_fake_camera
  gr_protocol:
    path: ../packages/gr_protocol
  intl: any
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  # `flutter run` and `flutter build` without --flavor build dev.
  default-flavor: dev
  generate: true
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/welcome.jpg
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
    - assets/privacy.md
  shaders:
    - shaders/look_lut.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
