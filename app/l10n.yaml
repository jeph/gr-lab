# Flutter's gen-l10n: `flutter pub get` and every build generate
# AppLocalizations from the messages in lib/l10n (AGENTS.md, "Text the user
# sees").
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
