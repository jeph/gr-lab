include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # An app is not a library others call: its public members are used only
    # inside it. Very Good Ventures' own app template (very_good_core)
    # turns this rule off; the packages keep it.
    public_member_api_docs: false
