name: Release

# Every push to main releases GR Photo 0.0.N: the Android app as a signed APK on GitHub release v0.0.N, and the iOS app
# on TestFlight. N, also the APK's versionCode and the iOS build number, is one more than the latest release's. A
# rerun for a commit that already has a release reuses its version. The jobs split the work so that each credential
# is held by as little as possible:
#   version        numbers the release from the tags
#   android-build  runs tool/check.sh and builds the APK, with read-only repository access and no secrets, so nothing
#                  the build runs, such as Gradle plugins or pub packages, can reach a key
#   android-sign   signs the APK with the release key from the `release` environment, which only main can deploy to
#   ios-build      builds the iOS archive, with read-only repository access and no secrets
#   ios-sign       signs the archive for the App Store with the distribution certificate and the provisioning
#                  profiles from the `testflight` environment, which only main can deploy to
#   publish        creates the GitHub release with the APK, the only job allowed to write to the repository. It waits
#                  for both signed apps, so a version is not released for one platform alone
#   testflight     uploads the signed iOS app to App Store Connect with the API key from the `testflight` environment.
#                  It waits for the GitHub release, whose tag takes the version: App Store Connect keeping a build
#                  number the tag never took would make it refuse the next commit's upload
#
# App Store Connect takes each build number once, so rerunning testflight for a build it already has fails.
#
# The `release` environment holds:
#   secrets    ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD
#   variables  ANDROID_RELEASE_KEY_ALIAS, ANDROID_RELEASE_CERT_SHA256
#
# The `testflight` environment holds:
#   secrets    IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD,
#              IOS_PROVISIONING_PROFILE_BASE64, IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64,
#              APP_STORE_CONNECT_API_KEY_P8, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID
# The two provisioning profiles are the app's (io.jeph.grphoto) and that of its LiveActivity extension
# (io.jeph.grphoto.LiveActivity), which draws the app's Live Activities and has an App ID of its own. The certificate
# and the profiles expire a year after they are made; a profile names the certificate, so a new certificate needs
# new profiles.

on:
  push:
    branches: [main]

permissions: {}

# Releases run one at a time, in order; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

# Unlike the default shell, an explicit bash shell adds pipefail, so a failure anywhere in a pipeline fails the step.
defaults:
  run:
    shell: bash

env:
  # tool/install_flutter.sh installs this Flutter and refuses an archive with another digest.
  FLUTTER_VERSION: 3.47.9
  FLUTTER_SHA256_LINUX_X64: 25ed8c3c29d51a7353f2a944310b478af8214920639524b19c50a19e6c044c5a
  FLUTTER_SHA256_MACOS_ARM64: 6545b85938745dc5070e9faf2adf70233c1811009d87fe6d27bfcda5a04b7698
  BUILD_TOOLS_VERSION: 37.0.0
  # The Xcode that GR Photo's TestFlight builds are made with.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  version:
    name: Choose version
    # A fork has neither the keys nor the app's place on TestFlight.
    if: github.repository == 'jeph/gr-photo'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every release tag, to number this one after the latest.
          fetch-depth: 0
          fetch-tags: true

      - name: Choose version
        id: version
        run: |
          released=$(git tag --points-at HEAD --list 'v0.0.*' | sort -V | tail -n 1)
          if [ -n "$released" ]; then
            code=${released#v0.0.}
          else
            latest=$(git tag --list 'v0.0.*' | sed -n 's/^v0\.0\.\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
            code=$(( ${latest:-0} + 1 ))
          fi
          echo "Version 0.0.$code"
          echo "name=0.0.$code" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  android-build:
    name: Check and build for Android
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        run: tool/install_flutter.sh

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null'

      # The map's Android code (the maplibre_gl package) is compiled as Java 21, which the runner's default JDK 17
      # refuses ("invalid source release: 21"). The runner's image also holds JDK 21, and Flutter builds with the
      # JDK that JAVA_HOME names.
      - name: Use JDK 21
        run: |
          test -x "$JAVA_HOME_21_X64/bin/javac"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # The lockfile's versions and digests, and nothing newer. The second run writes AppLocalizations from the ARB
      # files, which the checks read.
      - name: Get packages
        run: |
          flutter pub get --enforce-lockfile
          cd app
          flutter pub get --enforce-lockfile

      # The formatter, the analyzer, the boundary and translation checks and every test suite; any failure stops the
      # release.
      - name: Check
        run: tool/check.sh

      # A release build: Dart compiled ahead of time, and R8 shrinking the Kotlin code and the resources. One APK
      # holds the code for every processor Flutter builds for (64-bit and 32-bit ARM, x86-64), so there is one file
      # to download whatever the phone. Gradle leaves the debug key's signature on it; android-sign replaces that
      # with the release key's.
      - name: Build
        working-directory: app
        run: >-
          flutter build apk --flavor prod --release
          --build-name "$VERSION_NAME"
          --build-number "$VERSION_CODE"

      - name: Verify APK
        run: |
          mkdir dist
          cp app/build/app/outputs/flutter-apk/app-prod-release.apk dist/gr-photo-built.apk
          # R8 writes the mapping, so a build it did not shrink has none to copy.
          gzip -9c app/build/app/outputs/mapping/prodRelease/mapping.txt > "dist/gr-photo-v$VERSION_NAME-mapping.txt.gz"
          badging=$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging dist/gr-photo-built.apk)
          package="package: name='io.jeph.grphoto' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'"
          if ! grep -q "^$package" <<< "$badging"; then
            echo "The APK isn't io.jeph.grphoto $VERSION_NAME ($VERSION_CODE)" >&2
            exit 1
          fi
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo "The APK is debuggable" >&2
            exit 1
          fi
          # A release build holds the Dart code compiled (libapp.so) for each processor; a debug build holds it as a
          # kernel file.
          files=$(unzip -Z1 dist/gr-photo-built.apk)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if ! grep -q "^lib/$abi/libapp\.so$" <<< "$files"; then
              echo "The APK lacks the compiled Dart code for $abi" >&2
              exit 1
            fi
          done
          if grep -q 'kernel_blob\.bin$' <<< "$files"; then
            echo "The APK's Dart code isn't compiled for release" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-apk
          path: dist/gr-photo-built.apk
          if-no-files-found: error
          retention-days: 7

      # R8 renames the release's classes; the mapping turns a Kotlin stack trace from the APK back into GR Photo's
      # names.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mapping
          path: dist/gr-photo-v*-mapping.txt.gz
          if-no-files-found: error
          retention-days: 7

  android-sign:
    name: Sign for Android
    needs: [version, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tool/sign_release_apk.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-apk
          path: built

      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS_VERSION" > /dev/null'

      - name: Sign APK
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ vars.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          mkdir dist
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" \
            tool/sign_release_apk.sh built/gr-photo-built.apk "dist/gr-photo-v$VERSION_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: dist/gr-photo-v*.apk
          if-no-files-found: error
          retention-days: 7

  ios-build:
    name: Build for iOS
    needs: version
    # macos-26 stops at Xcode 26.
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        run: tool/install_flutter.sh

      # The lockfile's versions and digests, and nothing newer.
      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Build
        run: tool/build_ios_archive.sh --build-name "$VERSION_NAME" --build-number "$VERSION_CODE"

      # A release build holds the Dart code compiled for arm64 in App.framework, where a debug build has a kernel
      # file beside a stub, and comes with the symbols that read its crash reports.
      - name: Verify archive
        run: |
          archive=app/build/ios/archive/Runner.xcarchive
          app="$archive/Products/Applications/Runner.app"
          properties() {
            /usr/libexec/PlistBuddy -c "Print :ApplicationProperties:$1" "$archive/Info.plist"
          }
          test "$(properties CFBundleIdentifier)" = io.jeph.grphoto
          test "$(properties CFBundleShortVersionString)" = "$VERSION_NAME"
          test "$(properties CFBundleVersion)" = "$VERSION_CODE"
          test "$(lipo -archs "$app/Runner")" = arm64
          test "$(lipo -archs "$app/Frameworks/App.framework/App")" = arm64
          test ! -e "$app/Frameworks/App.framework/flutter_assets/kernel_blob.bin"
          test -d "$archive/dSYMs/Runner.app.dSYM"
          # The extension that draws the app's Live Activities: App Store Connect refuses one whose identifier
          # does not begin with the app's or whose version differs from the app's.
          extension() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$app/PlugIns/LiveActivity.appex/Info.plist"
          }
          test "$(extension CFBundleIdentifier)" = io.jeph.grphoto.LiveActivity
          test "$(extension CFBundleShortVersionString)" = "$VERSION_NAME"
          test "$(extension CFBundleVersion)" = "$VERSION_CODE"
          test "$(lipo -archs "$app/PlugIns/LiveActivity.appex/LiveActivity")" = arm64

      # A tar file keeps the modes of the archive's files, which an artifact's own packing loses.
      - name: Pack archive
        run: |
          mkdir dist
          tar -cf dist/Runner.xcarchive.tar -C app/build/ios/archive Runner.xcarchive

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-archive
          path: dist/Runner.xcarchive.tar
          if-no-files-found: error
          retention-days: 7

  ios-sign:
    name: Sign for iOS
    needs: [version, ios-build]
    runs-on: xcode-27
    timeout-minutes: 30
    environment: testflight
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            tool/sign_ios_archive.sh
            app/ios/Runner/Runner.entitlements
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-archive
          path: built

      - name: Sign archive
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_PROVISIONING_PROFILE_BASE64 }}
        run: |
          tar -xf built/Runner.xcarchive.tar -C built
          tool/sign_ios_archive.sh built/Runner.xcarchive app/ios/Runner/Runner.entitlements exported
          mkdir dist
          mv exported/*.ipa "dist/gr-photo-v$VERSION_NAME.ipa"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-ipa
          path: dist/gr-photo-v*.ipa
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [version, android-sign, ios-sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the release
      id-token: write # sign the build provenance attestation with Sigstore
      attestations: write # store the attestation
      artifact-metadata: write # link the attestation to the release asset
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-apk
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mapping
          path: dist

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.apk > SHA256SUMS

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION_NAME" > /dev/null 2>&1; then
            echo "Release v$VERSION_NAME already exists"
            exit 0
          fi
          gh release create "v$VERSION_NAME" dist/*.apk dist/*-mapping.txt.gz dist/SHA256SUMS \
            --title "GR Photo $VERSION_NAME" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest

  testflight:
    name: Upload to TestFlight
    needs: [version, ios-sign, publish]
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    permissions:
      contents: read
    env:
      VERSION_NAME: ${{ needs.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tool/upload_testflight.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-ipa
          path: dist

      - name: Upload
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: tool/upload_testflight.sh "dist/gr-photo-v$VERSION_NAME.ipa"
